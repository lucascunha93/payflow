<main class="login">
  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Payflow</h1>
    <p class="muted">Entre para criar e acompanhar pagamentos.</p>

    <label for="email">E-mail</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      [attr.aria-invalid]="showError('email')"
      aria-describedby="email-error"
    />
    @if (showError('email')) {
      <p class="field-error" id="email-error">Informe um e-mail válido.</p>
    }

    <label for="password">Senha</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="showError('password')"
      aria-describedby="password-error"
    />
    @if (showError('password')) {
      <p class="field-error" id="password-error">Informe a senha.</p>
    }

    @if (errorMessage(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
