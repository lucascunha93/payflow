server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The browser talks to a single origin; nginx routes each path to its service.
  location /api/notifications {
    proxy_pass http://notifications-service:3002;
  }

  location /api/ {
    proxy_pass http://payments-api:3000;
  }

  # Hashed bundles never change, so they can be cached for a long time.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  # Client-side routes fall back to the application shell.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
