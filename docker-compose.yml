name: payflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: payflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  payments-api:
    build: ./services/payments-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://payflow:${POSTGRES_PASSWORD}@postgres:5432/payflow
      RABBITMQ_URL: amqp://payflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:?Copy .env.example to .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Copy .env.example to .env}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY_HOPS: 1
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  notifications-service:
    build: ./services/notifications-service
    environment:
      PORT: 3002
      MONGODB_URL: mongodb://mongo:27017/payflow
      RABBITMQ_URL: amqp://payflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      payments-api:
        condition: service_healthy
      notifications-service:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
